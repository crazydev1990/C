<!-- HTML Structure -->
<div id="colorBox" style="width: 200px; height: 100px; border: 1px solid black; background-color: lightgray;">
    Hover over me!
</div>
<script>
    // JavaScript Implementation
const colorBox = document.getElementById('colorBox');

// Task 3: Mouseover changes background color
colorBox.addEventListener('mouseover', () => {
    colorBox.style.backgroundColor = 'lightblue';
});

// Task 4: Mouseout resets background color
colorBox.addEventListener('mouseout', () => {
    colorBox.style.backgroundColor = 'lightgray';
});

</script>
